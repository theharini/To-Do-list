<!DOCTYPE html> 
<!-- Tells the browser this document is HTML5 -->

<html lang="en">
<!-- Root element of the webpage
     lang="en" means the language of this page is English -->

<head>
    <meta charset="UTF-8">
    <!-- Sets character encoding to UTF-8
         (Supports all characters including symbols and emojis) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the website responsive on mobile devices -->

    <title>To Do List</title>
    <!-- Title shown in browser tab -->

    <link rel="stylesheet" href="style.css">
    <!-- Connects external CSS file for styling -->
</head>

<body>
    <!-- Body contains everything visible on the webpage -->

    <div class="container">
        <!-- Main outer container for layout -->

        <div class="todo-app">
            <!-- To-Do app box -->

            <h2>
                To-Do List 
                <img src="icon.png" alt="Icon">
                <!-- Image displayed next to heading
                     alt text is shown if image fails to load -->
            </h2>
            
            <div class="row">
                <!-- Row contains input field and Add button -->

                <input type="text" id="input-box" placeholder="Add your task">
                <!-- Text input field where user types task
                     id is used in JavaScript to access this element
                     placeholder shows light text inside box -->

                <button onclick="addTask()">Add</button>
                <!-- Button to add task
                     onclick calls JavaScript function addTask() -->
            </div>

            <ul id="list-container">
                <!-- Unordered list where tasks will be displayed
                     JavaScript will dynamically add <li> items here -->
            </ul>

        </div>
    </div>

    <script src="todo.js"></script>
    <!-- Connects external JavaScript file
         This file contains logic like addTask() -->
</body>
</html>
